---
# role: hosts
# file: defaults/main.yml

# Back up /etc/hosts when its contents change.
hosts_backup: true

# Domain appended to the short hostname; an empty string omits the FQDN.
hosts_domain: "{{ ansible_facts.domain }}"
# hosts_domain: example.org

# Add all gathered non-loopback IPv4 and IPv6 addresses instead of a single address.
hosts_ip_all: false

# Use hosts_ip_address directly, without automatic DHCP address selection.
hosts_ip_static: false

# Single host address, with a loopback default when no default IPv4 address is available.
hosts_ip_address: "{{ ansible_facts.default_ipv4.address | default('127.0.1.1') }}"
# hosts_ip_address: 192.0.2.20

# Additional IPv4 or IPv6 records with a canonical name and optional aliases.
hosts_entries: []
# hosts_entries:
#   - ip: 192.0.2.15
#     name: application.example.org
#     aliases: [application]
#   - ip: 2001:db8::15
#     name: application6.example.org
