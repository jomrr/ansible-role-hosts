---
# role: hosts
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
  options:
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      allow_world_readable_tmpfiles: true
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
      remote_tmp: "/tmp/.ansible/tmp"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    prepare: "../resources/playbooks/prepare.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  inventory:
    group_vars:
      all:
        hosts_domain: "molecule.invalid"
        hosts_ip_static: true
        hosts_ip_address: "192.0.2.20"
        hosts_entries:
          - ip: "192.0.2.20"
            name: "{{ ansible_facts.hostname }}"
            aliases:
              - "{{ ansible_facts.hostname ~ '.' ~ hosts_domain }}"
          - ip: "192.0.2.99"
            name: "{{ ansible_facts.hostname ~ '.' ~ hosts_domain }}"
            aliases:
              - "{{ ansible_facts.hostname }}"
          - ip: "192.0.2.10"
            name: "{{ ansible_facts.hostname ~ '.' ~ hosts_domain }}"
            aliases:
              - "hosts-v4.invalid"
              - "{{ ansible_facts.hostname }}"
              - "hosts-alias.invalid"
          - ip: "192.0.2.20"
            name: "hosts-local-ip.invalid"
            aliases:
              - "{{ ansible_facts.hostname ~ '.' ~ hosts_domain }}"
              - "hosts-local-alias.invalid"
              - "{{ ansible_facts.hostname }}"
          - ip: "2001:db8::10"
            name: "hosts-v6.invalid"
            aliases:
              - "{{ ansible_facts.hostname }}"
              - "{{ ansible_facts.hostname ~ '.' ~ hosts_domain }}"
        __hosts_expected_additional_records:
          - - "192.0.2.10"
            - "hosts-v4.invalid"
            - "hosts-alias.invalid"
          - - "192.0.2.20"
            - "hosts-local-ip.invalid"
            - "hosts-local-alias.invalid"
          - - "2001:db8::10"
            - "hosts-v6.invalid"
        __hosts_expected_records:
          hosts-v4.invalid:
            - "192.0.2.10"
          hosts-alias.invalid:
            - "192.0.2.10"
          hosts-local-ip.invalid:
            - "192.0.2.20"
          hosts-local-alias.invalid:
            - "192.0.2.20"
          hosts-v6.invalid:
            - "2001:db8::10"
          localhost:
            - "127.0.0.1"
            - "::1"
        __hosts_absent_records:
          - "hosts-stale.invalid"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "check"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "converge"
    - "idempotence"
    - "verify"
    - "destroy"
  name: "default"
platforms:
  - name: "hosts"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "bridge"
    extra_opts:
      - "--no-hosts"
