---
# role: hosts
# file: molecule/dev/molecule.yml

dependency:
  name: "galaxy"
  options:
    role-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
    requirements-file: "${MOLECULE_PROJECT_DIRECTORY}/collections.yml"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.builtin.default"
      callback_result_format: "yaml"
      display_ok_hosts: false
      display_skipped_hosts: false
      show_task_path_on_failure: true
    connection:
      pipelining: true
  inventory:
    group_vars:
      all:
        ansible_podman_mount_detection: false
        hosts_domains:
          - "molecule.invalid"
          - "alternate.invalid"
        hosts_ip_static: true
        hosts_ip_address: "127.0.1.1"
        hosts_entries:
          - ip: "127.0.1.1"
            name: "{{ ansible_facts.hostname }}"
            aliases:
              - "{{ ansible_facts.hostname }}.molecule.invalid"
              - "{{ ansible_facts.hostname }}.alternate.invalid"
          - ip: "192.0.2.99"
            name: "{{ ansible_facts.hostname }}.molecule.invalid"
            aliases:
              - "{{ ansible_facts.hostname }}"
          - ip: "192.0.2.10"
            name: "{{ ansible_facts.hostname }}.alternate.invalid"
            aliases:
              - "hosts-v4.invalid"
              - "{{ ansible_facts.hostname }}"
              - "hosts-alias.invalid"
          - ip: "127.0.1.1"
            name: "hosts-local-ip.invalid"
            aliases:
              - "{{ ansible_facts.hostname }}.molecule.invalid"
              - "hosts-local-alias.invalid"
              - "{{ ansible_facts.hostname }}.alternate.invalid"
              - "{{ ansible_facts.hostname }}"
          - ip: "2001:db8::10"
            name: "hosts-v6.invalid"
            aliases:
              - "{{ ansible_facts.hostname }}"
              - "{{ ansible_facts.hostname }}.molecule.invalid"
              - "{{ ansible_facts.hostname }}.alternate.invalid"
        __hosts_expected_local_names:
          - "{{ ansible_facts.hostname }}.molecule.invalid"
          - "{{ ansible_facts.hostname }}.alternate.invalid"
          - "{{ ansible_facts.hostname }}"
        __hosts_expected_additional_records:
          - - "192.0.2.10"
            - "hosts-v4.invalid"
            - "hosts-alias.invalid"
          - - "127.0.1.1"
            - "hosts-local-ip.invalid"
            - "hosts-local-alias.invalid"
          - - "2001:db8::10"
            - "hosts-v6.invalid"
        __hosts_expected_records:
          hosts-v4.invalid:
            - "192.0.2.10"
          hosts-alias.invalid:
            - "192.0.2.10"
          hosts-local-ip.invalid:
            - "127.0.1.1"
          hosts-local-alias.invalid:
            - "127.0.1.1"
          hosts-v6.invalid:
            - "2001:db8::10"
          localhost:
            - "127.0.0.1"
            - "::1"
        __hosts_absent_records:
          - "hosts-stale.invalid"
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "check"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "converge"
    - "idempotence"
    - "verify"
    - "destroy"
  name: "dev"
platforms:
  - name: "almalinux-latest-hosts"
    image: "docker.io/jomrr/molecule-almalinux:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "bridge"
    extra_opts:
      - "--no-hosts"
  - name: "debian-latest-hosts"
    image: "docker.io/jomrr/molecule-debian:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "bridge"
    extra_opts:
      - "--no-hosts"
  - name: "fedora-latest-hosts"
    image: "docker.io/jomrr/molecule-fedora:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "bridge"
    extra_opts:
      - "--no-hosts"
  - name: "opensuse-leap-latest-hosts"
    image: "docker.io/jomrr/molecule-opensuse-leap:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "bridge"
    extra_opts:
      - "--no-hosts"
  - name: "opensuse-tumbleweed-latest-hosts"
    image: "docker.io/jomrr/molecule-opensuse-tumbleweed:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "bridge"
    extra_opts:
      - "--no-hosts"
  - name: "ubuntu-latest-hosts"
    image: "docker.io/jomrr/molecule-ubuntu:latest"
    pre_build_image: true
    override_command: false
    systemd: "true"
    network: "bridge"
    extra_opts:
      - "--no-hosts"
