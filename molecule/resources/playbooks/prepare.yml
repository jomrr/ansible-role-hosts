---
# role: hosts
# file: molecule/resources/playbooks/prepare.yml

- name: HOSTS | Prepare existing host records
  hosts: all
  gather_facts: true
  tasks:
    - name: HOSTS | Refresh Debian package metadata
      become: true
      become_user: root
      ansible.builtin.apt:
        update_cache: true
      when: ansible_facts.pkg_mgr == 'apt'

    - name: HOSTS | Seed obsolete host records
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /etc/hosts
        content: |
          127.0.0.1 localhost
          ::1 localhost
          192.0.2.99 hosts-stale.invalid
        owner: root
        group: root
        mode: '0644'
