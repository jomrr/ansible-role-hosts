---
# role: hosts
# file: molecule/resources/tasks/verify_records.yml

- name: HOSTS | Resolve managed names and verify removal of obsolete records
  ansible.builtin.script:
    cmd: >-
      {{ (playbook_dir ~ '/../scripts/verify_records.py') | quote }}
      {{ __hosts_expected_records | to_json | quote }}
      {{ __hosts_absent_records | to_json | quote }}
      {{ __hosts_expected_additional_records | to_json | quote }}
    executable: python3
  changed_when: false
